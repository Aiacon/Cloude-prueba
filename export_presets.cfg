; Preset de exportación a Android, forzado a arquitectura de 32 bits (armeabi-v7a)
; para lograr esa sensación "retro" en dispositivos también antiguos.
;
; gradle_build/use_gradle_build=false: exportación "rápida" con la plantilla
; precompilada (android_debug.apk / android_release.apk), sin necesitar un
; proyecto Gradle/Android Studio completo. Aun así Godot necesita un Android
; SDK local (al menos "platform-tools" + "build-tools", para firmar/alinear
; el APK con apksigner/zipalign) configurado en Editor Settings > Export >
; Android > Android SDK Path. Instálalo con Android Studio o con las
; "command line tools" de https://developer.android.com/studio#command-tools.

[preset.0]

name="Android (32-bit)"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/templo_elemental.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

gradle_build/use_gradle_build=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=true
architectures/arm64-v8a=false
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.aiacon.temploelemental"
package/name="Templo Elemental"
package/signed=true
package/app_category=3
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
screen/orientation="landscape"

; Preset Web (HTML5): se juega desde cualquier navegador (celular, tablet,
; PC) sin instalar nada. Requiere las plantillas de exportación Web de
; Godot (Editor > Manage Export Templates) - no necesita Android SDK.

[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=2
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.05, 0.05, 0.08, 1)
