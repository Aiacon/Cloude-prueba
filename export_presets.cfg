; Preset de exportación a Android, forzado a arquitectura de 32 bits (armeabi-v7a)
; para lograr esa sensación "retro" en dispositivos también antiguos.
; Antes de exportar desde el editor de Godot: Project > Export... y confirma la
; ruta del Android SDK / plantillas de exportación (Editor > Editor Settings > Export > Android).

[preset.0]

name="Android (32-bit)"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/templo_elemental.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=true
architectures/arm64-v8a=false
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.aiacon.temploelemental"
package/name="Templo Elemental"
package/signed=true
package/app_category=3
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
screen/orientation="landscape"
